# MINIMAL-TEST: nur Hardware-Init (exakt wie im Hauptprojekt, aus Waveshare_Swirch.yaml
# verifiziert) + ein einziges LVGL-Label "Hello World". Keine Wecker-Logik, keine Switches,
# keine Scripts, kein Alarm. Dient zur Fehlersuche: crasht schon DAS an "Performing bus
# recovery", liegt es zu 100% an ESPHome selbst (Version/I2C-Treiber), nicht an unserer
# Wecker-Logik. Laeuft/crasht es NICHT, bauen wir Schritt fuer Schritt unsere Logik wieder
# ein, bis wir sehen, welcher Teil das Problem verursacht.

esphome:
  name: smart-wecker-waveshare-01
  friendly_name: Smart-Wecker Waveshare Test 01
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80Mhz

logger:

ota:
  - platform: esphome
    password: !secret OTA_Secret

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Hello-Test Fallback"

api:
  encryption:
    key: !secret api_encryption_key

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: waveshare_touch
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    rotation: 0
    update_interval: 1s
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: "LCD Backlight"
    restore_mode: ALWAYS_ON

font:
  - file: "gfonts://Roboto"
    id: font_large
    size: 40

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  pages:
    - id: hello_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            text_font: font_large
            text_color: 0xFFFFFF
            text: "Hello World"
