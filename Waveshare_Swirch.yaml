# Board: Generic ESP32-S3 Board (Generic)
# Definition: definitions/boards/generic-esp32s3/manifest.yaml

esphome:
  name: waveshare-switch
  friendly_name: Waveshare_Switch
  platformio_options:
    board_upload.maximum_ram_size: 524288

# esp32: # (Auto-commented)
esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
#        execute_from_psram: true

psram: # (Auto-commented)
  mode: octal
  speed: 80Mhz

# preferences: # (Auto-commented)
#   flash_write_interval: 5min

logger:

api:
  encryption:
    key: "gjP1Z+tuJ7J5OCFrWUJM/vRnTSKtwT6W6tsS9V1s75E="

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: Waveshare_Switc Fallback Hotspot
    password: "cZhIU81S0SUI"

captive_portal:
# ============================================================================
# ESPHome YAML - Generated by ESPHome Designer
# ============================================================================
# TARGET DEVICE: Waveshare Touch LCD 7 7.0" 800x480
#         - Display Platform: mipi_rgb (RGB LCD)
#         - PSRAM: Yes (Octal, 80MHz)
#         - Touchscreen: GT911 (I2C via CH422G)
#         - Framework: ESP-IDF with execute_from_psram
# ============================================================================
#
# BASED ON: https://github.com/agillis/esphome-modular-lvgl-buttons
# Hardware configuration adapted for ESPHome Designer.
#
# ============================================================================
#
# SETUP INSTRUCTIONS:
#
# STEP 1: Copy the Material Design Icons font file
#         - From this repo: resources/fonts/materialdesignicons-webfont.ttf
#         - To ESPHome: /config/esphome/fonts/materialdesignicons-webfont.ttf
#         (Create the fonts folder if it doesn't exist)
#
# STEP 2: Create a new device in ESPHome
#         - Click "New Device"
#         - Name: your-device-name
#         - Select: ESP32-S3
#         - Framework: ESP-IDF (Required for this device)
#
# STEP 3: PASTE this snippet into your device YAML
#         - Paste this snippet at the end of your configuration.
#         - System sections (esphome, esp32, psram, etc.) are auto-commented
#           to avoid conflicts with your existing setup.
#
# CAPTIVE PORTAL:
#         - If WiFi connection fails, look for a hotspot named:
#           "Waveshare-Hotspot"
#         - Connect and go to http://192.168.4.1 to configure WiFi.
#
# ============================================================================

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: my_touchscreen
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false
  on_release:
    - if:
        condition: lvgl.is_paused
        then:
          - lvgl.resume:
          - lvgl.widget.redraw:
          - light.turn_on: display_backlight

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: my_display
    rotation: 0
    update_interval: 1s
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

# ====================================
# Device Settings
# ====================================
# Orientation: landscape
# Dark Mode: disabled
# Refresh Interval: 600
# Power Strategy: Backlight Off Schedule
# Deep Sleep: disabled
# Deep Sleep Stay Awake Switch: disabled
# Deep Sleep Stay Awake Entity: input_boolean.esphome_stay_awake
# Deep Sleep Firmware Guard: disabled
# Deep Sleep Interval: Disabled
# Layout Signature: 2a428738
# Layout Summary: mode=lvgl pages=1 widgets=4 types=image:1,lvgl_button:1,lvgl_slider:1,lvgl_switch:1
# Boot Log Hint: Compare the runtime build signature with this header to spot OTA rollbacks.
# ====================================

switch:
  - platform: gpio
    id: lcdbacklight
    name: lcdbacklight
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false
    restore_mode: ALWAYS_ON

  - platform: homeassistant
    id: input_boolean_lcd_test
    entity_id: input_boolean.lcd_test
    on_state:
      then:
        - lvgl.widget.update:
            id: w_mspnbtxdywhev
            state:
              checked: !lambda return x;
    internal: true

light:
  - platform: monochromatic
    name: "Display Backlight"
    output: fake_backlight_output
    id: display_backlight
    default_transition_length: 1s
    gamma_correct: 2.8

output:
  - platform: template
    id: fake_backlight_output
    type: float
    write_action:
      - lambda: |-
          ESP_LOGD("fake_light", "Fake brightness level: %.2f", state);

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

globals:
  - id: display_page
    type: int
    restore_value: true
    initial_value: '0'
  - id: page_refresh_default_s
    type: int
    restore_value: true
    initial_value: '600'
  - id: page_refresh_current_s
    type: int
    restore_value: false
    initial_value: '60'
  - id: initial_sensor_sync_pending
    type: bool
    restore_value: false
    initial_value: 'true'

time:
  - platform: homeassistant
    id: ha_time

sensor:
  - platform: homeassistant
    id: input_number_lcd_test_slider
    entity_id: input_number.lcd_test_slider
    on_value:
      then:
        - lvgl.widget.refresh: w_msrrn2cp2dfou
    internal: true

image:
  - file: "/config/esphome/image/gradient_800_480.png"
    id: img_config_esphome_image_gradient_800_480_png_800x480
    type: RGB565
    resize: 800x480
    transparency: opaque

font:
  - file:
      type: gfonts
      family: "Roboto"
      weight: 400
      italic: false
    id: font_roboto_400_14
    size: 14
    glyphsets: [GF_Latin_Kernel]
    ignore_missing_glyphs: true

script:

  - id: manage_run_and_sleep
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !(id(ha_time).now().is_valid() && api_is_connected());'
          then:
            - logger.log: "Waiting for sync..."
            - wait_until:
                condition:
                  lambda: 'return id(ha_time).now().is_valid() && api_is_connected();'
                timeout: 120s
      - if:
          condition:
            lambda: 'return id(initial_sensor_sync_pending);'
          then:
            - logger.log: "ESPHome Designer build: sig=2a428738 mode=lvgl pages=1 widgets=4 types=image:1,lvgl_button:1,lvgl_slider:1,lvgl_switch:1"
            - logger.log: "OTA hint: if this build line does not match the YAML header, the device booted a different image or rolled back."
            - logger.log: "Waiting 5s for initial sensor updates..."
            - delay: 5s
            - lambda: 'id(initial_sensor_sync_pending) = false;'
      - lambda: |-
          int interval = id(page_refresh_default_s);
          id(page_refresh_current_s) = interval;
      - delay: !lambda 'return id(page_refresh_current_s) * 1000;'
      - script.execute: manage_run_and_sleep
# ============================================================================
# LVGL Configuration
# ============================================================================

lvgl:
  id: my_lvgl
  log_level: WARN
  bg_color: "0xFFFFFF"
  displays:
    - my_display
  touchscreens:
    - touchscreen_id: my_touchscreen
  pages:
    - id: page_0
      widgets:
        - image:
            id: w_mspncws98ecmj
            angle: 0
            height: 480
            image_recolor_opa: transp
            src: img_config_esphome_image_gradient_800_480_png_800x480
            width: 800
            x: 0
            y: 0
        - switch:
            id: w_mspnbtxdywhev
            height: 40
            indicator:
              bg_color: "0x0000FF"
            knob:
              bg_color: "0xFFFFFF"
            on_value:
              -
                if:
                  condition:
                    lambda: return x != id(input_boolean_lcd_test).state;
                  then:
                    -
                      homeassistant.action:
                        data:
                          entity_id: input_boolean.lcd_test
                        action: homeassistant.toggle
            state:
              checked: !lambda return id(input_boolean_lcd_test).state;
            width: 120
            x: 351
            y: 47
        - slider:
            id: w_msrrn2cp2dfou
            height: 40
            indicator:
              bg_color: "0x0000FF"
            knob:
              bg_color: "0x0000FF"
              border_color: 0xFFFFFF
              border_width: 2
            max_value: 100
            min_value: 0
            on_release:
              - homeassistant.action:
                  action: input_number.set_value
                  data:
                    entity_id: input_number.lcd_test_slider
                    value: !lambda "return int(x);"
            value: !lambda "return int(id(input_number_lcd_test_slider).state);"
            width: 345
            x: 351
            y: 154

        - button:
            id: w_msrrnc3o1guhx
            height: 133
            on_click:
              -
                homeassistant.action:
                  data:
                    entity_id: input_button.lcd_test_button
                  action: input_button.press
            widgets:
              -
                label:
                  align: center
                  text: "Button"
                  text_color: "0x000000"
                  text_font: font_roboto_400_14
            width: 120
            x: 340
            y: 303