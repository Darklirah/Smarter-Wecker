# STUFE 02: wie 01 (Hardware-Init, funktioniert bestaetigt), PLUS:
#   - time: platform sntp + on_time_sync/on_time Trigger
#   - clock_update_script (Uhrzeit/Datum per Lambda + lvgl.label.update)
#   - vollstaendige clock_page (2 Labels, NTP-Status-Punkt, "Einst."-Button)
# NOCH NICHT dabei: number/roller (Weckzeit), switch:platform:lvgl (Wochentage/Hauptschalter),
# settings_page, alarm_page, alarm_check_script, alarm_ring_script.
# Ziel: isolieren, ob schon dieser Teil (Zeit-Sync + Script + etwas mehr LVGL-Komplexitaet)
# den Crash ausloest, oder erst die spaeteren Teile.

esphome:
  name: smart-wecker-waveshare-02
  friendly_name: Smart-Wecker Waveshare Test 02
  platformio_options:
    board_upload.maximum_ram_size: 524288

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80Mhz

logger:

ota:
  - platform: esphome
    password: !secret OTA_Secret

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Waveshare-Test-02 Fallback"

api:
  encryption:
    key: !secret api_encryption_key

captive_portal:

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: waveshare_touch
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    rotation: 0
    update_interval: 1s
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 16MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: "LCD Backlight"
    restore_mode: ALWAYS_ON

time:
  - platform: sntp
    id: current_time
    timezone: Europe/Berlin
    on_time_sync:
      then:
        - lvgl.widget.update:
            id: ntp_status_dot
            bg_color: 0x4CAF50
        - script.execute: clock_update_script
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_update_script

script:
  - id: clock_update_script
    then:
      - lvgl.label.update:
          id: clock_time_label
          text: !lambda |-
            auto now = id(current_time).now();
            static char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return buf;
      - lvgl.label.update:
          id: clock_date_label
          text: !lambda |-
            static const char * const day_names[] = {"Sonntag", "Montag", "Dienstag",
                "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char * const month_names[] = {"Januar", "Februar", "Maerz", "April",
                "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            auto now = id(current_time).now();
            static char buf[40];
            snprintf(buf, sizeof(buf), "%s, %d. %s", day_names[now.day_of_week - 1],
                now.day_of_month, month_names[now.month - 1]);
            return buf;

font:
  - file: "gfonts://Roboto"
    id: font_huge
    size: 96
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_medium
    size: 24
    bpp: 4
  - file: "gfonts://Roboto"
    id: font_small
    size: 18
    bpp: 4

lvgl:
  displays:
    - waveshare_display
  touchscreens:
    - waveshare_touch
  pages:
    - id: clock_page
      bg_color: 0x000000
      widgets:
        - label:
            align: CENTER
            y: -40
            id: clock_time_label
            text_font: font_huge
            text_color: 0xFFFFFF
            text: "--:--"
        - label:
            align: CENTER
            y: 60
            id: clock_date_label
            text_font: font_medium
            text_color: 0xAAAAAA
            text: ""
        - obj:
            id: ntp_status_dot
            align: TOP_RIGHT
            x: -16
            y: 16
            width: 14
            height: 14
            radius: 7
            bg_color: 0xF44336
        - button:
            align: BOTTOM_RIGHT
            x: -20
            y: -20
            width: 90
            height: 60
            bg_color: 0x424242
            radius: 8
            widgets:
              - label:
                  align: CENTER
                  text: "Einst."
                  text_color: 0xFFFFFF
                  text_font: font_small
