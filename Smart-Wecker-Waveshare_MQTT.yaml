    # Alarm-Seite: KEIN physischer Taster auf diesem Board -- stattdessen zwei GROSSE
    # Touchflaechen, damit man sie auch halb verschlafen sicher trifft. Kein Ton (kein
    # Audio auf diesem Board) -- die Weckung ist rein visuell: Hintergrund UND das grosse
    # "ALARM"-Label blinken abwechselnd. Die Tasten sind bewusst nicht komplett riesig
    # (260x260), damit das "ALARM"-Label am oberen Rand nicht ueberlappt wird.
    - id: alarm_page
      bg_color: 0x330000
      widgets:
        - obj:
            id: alarm_bg
            width: 100%
            height: 100%
            align: CENTER
            bg_color: 0x330000
            border_width: 0
            radius: 0
        - label:
            id: alarm_text_label
            align: TOP_MID
            y: 30
            text_font: font_huge
            text_color: 0xFF1744
            text: "ALARM"
        - button:
            align: LEFT_MID
            x: 20
            y: 60
            width: 260
            height: 260
            bg_color: 0x2E7D32
            radius: 16
            widgets:
              - label:
                  align: CENTER
                  text: "SNOOZE\n9 Min"
                  text_color: 0xFFFFFF
                  text_font: font_large
            on_click:
              then:
                - script.execute: alarm_snooze_script
        - button:
            align: RIGHT_MID
            x: -20
            y: 60
            width: 260
            height: 260
            bg_color: 0xD32F2F
            radius: 16
            widgets:
              - label:
                  align: CENTER
                  text: "STOP"
                  text_color: 0xFFFFFF
                  text_font: font_large
            on_click:
              then:
                - script.execute: alarm_stop_script
