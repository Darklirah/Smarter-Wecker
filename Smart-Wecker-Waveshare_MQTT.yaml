    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - logger.log:
            format: "[wecker] alarm_tue on_turn_on gefeuert, ui_ready=%d"
            args: ["(int) id(ui_ready)"]
        - if:
            condition:
              lambda: "return id(ui_ready);"
            then:
              - lvgl.widget.update:
                  id: checkbox_tue
