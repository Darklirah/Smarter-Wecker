# Smart-Wecker (Waveshare-Variante) – ESPHome-Hauptkonfiguration
# Board: Waveshare ESP32-S3-Touch-LCD-7 (Basisversion, CH422G-IO-Expander)
# Details/Quellen: siehe Docs/hardware-specs.md und Docs/quellen.md
#
# Hardware-Einschraenkungen dieses Boards:
#   - KEINE Audioausgabe (dieses Board hat keinen Onboard-Verstaerker/Lautsprecheranschluss
#     und keine sicher verlötbaren freien GPIOs dafuer -- siehe Docs/hardware-specs.md)
#   - KEIN physischer Taster (kein sicher nutzbarer freier GPIO dafuer) -- stattdessen eine
#     GROSSE Touchflaeche auf dem Alarm-Bildschirm zum Stoppen/Snoozen
#   - Backlight ist hier nur Ein/Aus (kein PWM/Dimmen) -- Hardware-/Paket-Eigenschaft dieses
#     Boards, siehe Docs/hardware-specs.md
#
# HINWEIS ZUR HARDWARE-KONFIGURATION:
# Das anfangs genutzte Community-Paket (inytar/waveshare-esp32-s3-touch-lcd-7-esphome) hat
# auf diesem konkreten Geraet zu Boot-Abstuerzen gefuehrt (PSRAM-Timing UND ein
# I2C-"Bus Recovery"-Crash). Der Nutzer hat eine selbst getestete, nachweislich
# funktionierende Hardware-Config (Waveshare_Swirch.yaml, per "ESPHome Designer" erzeugt)
# beigesteuert -- die Hardware-Sektion unten ist im Kern von dort uebernommen (u.a.
# flash_size: 16MB statt 8MB, KEIN execute_from_psram/experimental_features, die
# Sync-Porch-Werte). EINZIGE spaetere Abweichung von der Referenz: `pclk_frequency`
# wurde von 16MHz auf 14MHz gesenkt (siehe Abschnitt "Bildschirm-Zucken" unten) --
# alle anderen Hardware-Werte NICHT ohne erneuten Hardware-Test veraendern.
#
# HINWEIS ZUR WECK-LOGIK (nach ausfuehrlicher Fehlersuche, siehe
# ../ESPHome-Lessons-Learned.md): Eine 13-stufige Bisektion (smart-wecker-waveshare-01.yaml
# bis -13.yaml) hat gezeigt, dass JEDE direkte Rueckkopplung "Entity aendert sich -> LVGL-
# Widget wird automatisch aktualisiert" WAEHREND DES BOOT-RESTORES (bevor LVGL
# initialisiert ist) zu Abstuerzen fuehrt. Seit den Fixes fuer das Bildschirm-Zucken
# (siehe unten) gibt es dafuer eine kontrollierte, sichere Ausnahme: die on_turn_on/
# on_turn_off-Handler der Schalter UND der Weckzeit-on_value-Handler (Roller) duerfen ein
# lvgl.*.update ausloesen, aber NUR wenn ein globales `ui_ready`-Flag bereits `true` ist
# (wird erst 2s NACH on_boot gesetzt, siehe esphome.on_boot weiter unten) -- das umgeht
# exakt das urspruengliche Absturzmuster, weil LVGL zu diesem Zeitpunkt garantiert fertig
# initialisiert ist. Ein zusaetzliches `roller_driven_update`-Flag (siehe globals:)
# verhindert ausserdem, dass ein Roller sich waehrend des eigenen Scrollens selbst
# ueberschreibt. Details: ESPHome-Lessons-Learned.md / Memory
# "esphome-number-lvgl-roller-setup-race".
#
# HINWEIS ZUR PERSISTENZ: Die Weckzeit wurde nach jedem Neustart auf 00:00
# zurueckgesetzt. NICHT die Ursache war esphome.on_boot's Standard-Prioritaet (600).
# Die ECHTE Ursache: ESPHome schreibt restore_value-Aenderungen erst nach
# `flash_write_interval` (Standard 1 Minute!) auf den Flash -- ein Neustart kurz nach
# dem Aendern verlor die Aenderung also immer. Fix: `preferences: flash_write_interval:
# 0s` weiter unten (schreibt sofort).
#
# BILDSCHIRM-ZUCKEN (13.09.2026, ausfuehrliche Fehlersuche, siehe CHANGELOG.md fuer die
# volle Chronik): Der Nutzer bemerkte ein kurzes, unregelmaessiges Zucken/Bildversatz-
# Flackern der Anzeige. Ausgeschlossen wurden nacheinander: periodisches Widget-Polling
# der Schalter (jetzt komplett ereignisgesteuert statt gepollt, siehe unten), display:
# update_interval (1s bis 30s getestet, kein messbarer Unterschied), WLAN-Modem-Sleep
# (`power_save_mode: none` ergaenzt, kein klarer Effekt, aber beibehalten). Vermutete
# Ursache: PSRAM-Bandbreiten-Konkurrenz zwischen dem RGB-Display-DMA und anderen
# Komponenten -- ein bekanntes Muster bei ESP32-S3-Boards mit parallelem RGB-Display und
# Framebuffer im PSRAM; der ESPHome mipi_rgb-Treiber bietet dafuer keinen direkten
# Bounce-Buffer-Parameter ueber YAML (im Quellcode gegengeprueft). Einziger wirksamer
# Hebel: `pclk_frequency` (Pixeltakt) senken, reduziert die PSRAM-Bandbreitenlast.
# ACHTUNG: 8,2MHz und 10MHz haben beide zu komplettem Sync-Verlust des Panels gefuehrt
# (wechselnde Farbflaechen statt normaler Anzeige) -- **NICHT unter 14MHz gehen, dieses
# Panel hat sehr wenig Spielraum unter dem Referenztakt 16MHz.** Bei 14MHz (~34Hz
# Bildwiederholrate statt ~39Hz) hat der Nutzer am Geraet eine deutliche Besserung
# bestaetigt (13.09.2026) -- das ist der jetzige, empfohlene Wert. Das Zucken ist damit
# deutlich seltener, aber NICHT mit Sicherheit vollstaendig ausgeschlossen -- falls es
# erneut auffaellt, waere ein Wert zwischen 14 und 16MHz der naechste Versuch.
#
# STAND (13.09.2026, vom Nutzer am Geraet bestaetigt funktionierend):
#   - Uhrzeit (grosse 144px-Anzeige) + Datum, blinkendes "Synchronisiere Zeit" bis zum
#     ersten Sync, NTP-Status-Punkt, Statuszeile unten ("Wecker: HH:MM - Wochentage")
#   - Aussen-/Zimmertemperatur oben (per MQTT, Quelle frei aus Home Assistant waehlbar,
#     Schalter zum Ausblenden bei fehlendem Wert)
#   - Einstellungsseite: Stunden-Roller + zwei Minuten-Ziffern-Roller (Zehner/Einer,
#     Endlos-Scroll), Hauptschalter mit dynamischem "Wecker aktiv/inaktiv"-Label,
#     7 Wochentag-Checkboxen -- ALLE live synchronisiert bei Fernaenderung (z.B. ueber
#     Home Assistant), ohne die Einstellungsseite verlassen/neu oeffnen zu muessen
#   - "OK"-Taste quittiert mit kurzem Aufblitzen der eingestellten Zeit, "Zurück"-Taste
#     -- beide kehren zur Uhr zurueck
#   - Native Home-Assistant-Entitaet "Weckzeit" (datetime/time) fuer komfortable
#     Fernbedienung, bidirektional mit den (in HA verborgenen, internal:true) Rollern
#     synchron gehalten; alarm_hour/alarm_minute + alle Wochentage + die Weckzeit-
#     Entitaet selbst sind persistent (ueberleben Neustarts, sofort geschrieben)
#   - Alarm: rein visuell (kein Ton auf diesem Board) -- Hintergrund UND ein grosses
#     rotes "ALARM"-Label blinken abwechselnd; SNOOZE (9 Min) und STOP als grosse,
#     bewusst nicht zu grosse Touchflaechen (260x260), damit "ALARM" nicht ueberlappt
#   - Schrift: glyphsets: GF_Latin_Core (statt Standard GF_Latin_Kernel) fuer deutsche
#     Umlaute/ß -- WICHTIG: ein rohes `glyphs: "äöü..."` ohne glyphsets hat sich als
#     fehlerhaft erwiesen (kompletter Basis-Zeichensatz fiel weg, nur leere Kaestchen)
#
# Kosmetik: oberste Zeile zeigt Aussen-/Zimmertemperatur. Die Werte kommen per MQTT
# (Topics "smartwecker/aussentemperatur" / ".../zimmertemperatur"), veroeffentlicht von
# einer HA-Automatisierung, die den in zwei input_text-Helfern ("Wecker
# Aussentemperatur-Quelle" / "...Zimmertemperatur-Quelle") frei eingetragenen
# Entity-Namen jede Minute (und sofort bei Aenderung des Helfers) ausliest und per
# mqtt.publish (retained) weiterreicht -- Quelle also komplett aus Home Assistant
# heraus wählbar, ohne den ESP32 neu zu flashen. Ein Schalter in HA ("Wecker
# Temperaturzeile ausblenden falls leer") steuert, ob bei fehlendem Wert "n/v"
# angezeigt oder die ganze Zeile ausgeblendet wird.
#
# Diese Datei ist der aktuelle, empfohlene Stand. Die vollstaendige Stufe-fuer-Stufe-
# Historie (inkl. der urspruenglichen Absturz-Bisektion 01-13 und der Zucken-Fehlersuche
# 29-38) steht in CHANGELOG.md; neue Experimente/Zwischenstufen landen ab jetzt im
# lokalen, nicht committeten Ordner Entwuerfe/.

esphome:
  name: smart-wecker-waveshare
  friendly_name: Smart-Wecker-Waveshare
  platformio_options:
    board_upload.maximum_ram_size: 524288
  on_boot:
    # priority: -100 -- laesst diesen Block garantiert erst NACH der Wiederherstellung
    # aller anderen Komponenten laufen (siehe ESPHome-Lessons-Learned.md). War am Ende
    # nicht die Ursache des 00:00-Reset-Bugs (das war flash_write_interval, siehe unten),
    # bleibt aber als korrekte Praxis bestehen.
    priority: -100
    then:
      - datetime.time.set:
          id: alarm_time_ha
          time: !lambda |-
            return {.second = 0, .minute = (int) id(alarm_minute).state,
                .hour = (int) id(alarm_hour).state};
      - script.execute: update_temp_label_script
      # STUFE 29: 2s nach dem Boot ist LVGL garantiert stabil initialisiert -- ab jetzt
      # duerfen die neuen on_turn_on/on_turn_off-Handler der Schalter direkt ein
      # lvgl.widget.update ausloesen (siehe Kommentar am Dateianfang).
      - delay: 2s
      - globals.set:
          id: ui_ready
          value: "true"

esp32:
  variant: esp32s3
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    advanced:
      loop_task_stack_size: 24576
    # KEIN execute_from_psram, KEIN enable_idf_experimental_features -- in der verifizierten
    # Referenz-Config bewusst deaktiviert/nicht gesetzt.

psram:
  mode: octal
  speed: 80Mhz

# flash_write_interval: 0s -- schreibt Aenderungen an persistenten Werten (Weckzeit,
# Wochentage, ...) SOFORT statt (Standard) bis zu 1 Minute zu sammeln. Fuer selten
# geaenderte Werte wie eine Weckzeit ist der zusaetzliche Flash-Verschleiss
# vernachlaessigbar; ohne dies ging ein kurz vor einem Neustart geaenderter Wert
# zuverlaessig verloren.
preferences:
  flash_write_interval: 0s

logger:

ota:
  - platform: esphome
    password: !secret OTA_Secret

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # STUFE 34 (EXPERIMENT): der ESP32 schaltet das WLAN-Modul standardmaessig periodisch
  # in einen Stromspar-/Modem-Sleep-Modus und weckt es alle paar Sekunden kurz auf --
  # ein bekannter Ursache-Kandidat fuer periodische kurze CPU-Stocker, die sich bei
  # einem parallelen RGB-Display (kein echter Doppelpuffer, kontinuierlicher Pixeltakt)
  # als kurzes Zucken/Tearing zeigen koennen. `none` deaktiviert den Sparmodus komplett
  # (etwas hoeherer Stromverbrauch, bei einem staendig am Netzteil haengenden
  # Wecker unerheblich). Alle bisherigen Tests (Update-Frequenzen der LVGL-Widgets,
  # display: update_interval von 1s bis 30s) haben das Zucken NICHT beeinflusst --
  # dieser Kandidat ist unabhaengig von der gesamten bisherigen Anwendungslogik.
  power_save_mode: none
  ap:
    ssid: "Smart-Wecker-Waveshare Fallback"

api:
  encryption:
    key: !secret api_encryption_key

captive_portal:

# Aussen-/Zimmertemperatur kommen per MQTT von Home Assistant (siehe Stufe-25-Hinweis
# oben) -- Broker ist derselbe, den auch Zigbee2MQTT im Netz bereits nutzt.
mqtt:
  broker: !secret MQTT-Broker
  port: 1883
  username: !secret MQTT-user
  password: !secret MQTT-Passwort
  # discovery: false -- wir nutzen mqtt: hier NUR zum Abonnieren der beiden
  # Temperatur-Topics. Die native API (api:) ist bereits der Weg, wie dieses Geraet in
  # HA eingebunden ist; ohne dies wuerde MQTT-Discovery ein zweites, redundantes
  # Geraet/Entity-Set in HA anlegen.
  discovery: false

sensor:
  - platform: mqtt_subscribe
    name: "Außentemperatur (MQTT)"
    id: outside_temp_mqtt
    topic: "smartwecker/aussentemperatur"
    internal: true
    on_value:
      then:
        - script.execute: update_temp_label_script
  - platform: mqtt_subscribe
    name: "Zimmertemperatur (MQTT)"
    id: room_temp_mqtt
    topic: "smartwecker/zimmertemperatur"
    internal: true
    on_value:
      then:
        - script.execute: update_temp_label_script

# ---------------------------------------------------------------------------
# DISPLAY, TOUCH, BACKLIGHT -- 1:1 aus der verifizierten Waveshare_Swirch.yaml uebernommen
# (siehe Hinweis oben). NICHT ohne erneuten Hardware-Test veraendern.
# ---------------------------------------------------------------------------

i2c:
  - id: bus_a
    sda: GPIO8
    scl: GPIO9
    scan: true

ch422g:
  - id: ch422g_hub

touchscreen:
  platform: gt911
  id: waveshare_touch
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    ch422g: ch422g_hub
    number: 1
    mode: OUTPUT
  transform:
    swap_xy: false
    mirror_x: false
    mirror_y: false

display:
  - platform: mipi_rgb
    model: ESP32-S3-TOUCH-LCD-7-800X480
    id: waveshare_display
    rotation: 0
    # STUFE 33 ERGEBNIS (13.09.2026): Zucken UNVERAENDERT auch bei 30s -- damit ist
    # update_interval als Ursache widerlegt (sonst haette sich die Zuck-Frequenz
    # sichtbar auf ~30s strecken muessen). Wieder auf den verifizierten
    # Hardware-Referenzwert 1s zurueckgesetzt. Naechster Verdaechtiger: WLAN-Modem-Sleep
    # (siehe wifi:-Sektion und Kommentar am Dateianfang, Stufe 34).
    update_interval: 1s
    auto_clear_enabled: false
    color_order: RGB
    # STUFE 38 (EXPERIMENT): 8,2MHz und 10MHz haben beide die Synchronisation verloren
    # (wechselnde Farbflaechen) -- 14MHz ist nur noch ~12,5% unter dem Referenzwert
    # 16MHz, entspricht ca. 14.000.000 / 410.000 =~ 34,1Hz (Rechnung siehe
    # Stufe-35-Kommentar weiter oben). Falls das Panel auch hierbei die Synchronisation
    # verliert, bleibt es endgueltig bei 16MHz -- dieses Panel scheint sehr wenig
    # Spielraum unter dem Referenztakt zu haben.
    pclk_frequency: 14MHZ
    dimensions:
      width: 800
      height: 480
    reset_pin:
      ch422g: ch422g_hub
      number: 3
    de_pin:
      number: GPIO5
    hsync_pin:
      number: GPIO46
      ignore_strapping_warning: true
    vsync_pin:
      number: GPIO3
      ignore_strapping_warning: true
    pclk_pin: GPIO7
    pclk_inverted: true
    hsync_back_porch: 8
    hsync_front_porch: 8
    hsync_pulse_width: 4
    vsync_back_porch: 8
    vsync_front_porch: 8
    vsync_pulse_width: 4
    data_pins:
      red: [1, 2, 42, 41, 40]
      blue: [14, 38, 18, 17, 10]
      green: [39, 0, 45, 48, 47, 21]

output:
  - platform: gpio
    id: lcdbacklight_output
    pin:
      ch422g: ch422g_hub
      number: 2
      mode:
        output: true
      inverted: false

light:
  - platform: binary
    output: lcdbacklight_output
    id: lcdbacklight
    name: "LCD Backlight"
    restore_mode: ALWAYS_ON

interval:
  - interval: 500ms
    then:
      - if:
          condition:
            lambda: "return !id(time_synced);"
          then:
            - lambda: "id(sync_blink_state) = !id(sync_blink_state);"
            - if:
                condition:
                  lambda: "return id(sync_blink_state);"
                then:
                  - lvgl.widget.show: sync_status_label
                else:
                  - lvgl.widget.hide: sync_status_label
      # STUFE 29: das unbedingte (Stufe 27) Nachziehen von Hauptschalter+Checkboxen bei
      # JEDEM Tick wurde entfernt. STUFE 30 hatte testweise ein 3s-Fallback-Polling
      # ergaenzt, falls der ereignisgesteuerte Weg nicht zuverlaessig greift -- das
      # Log vom 13.09.2026 hat aber bestaetigt (Zeitstempel passen exakt zu den
      # HA-Aenderungen, nicht zum 3s-Raster), dass der ereignisgesteuerte Weg
      # zuverlaessig funktioniert. STUFE 32: das 3s-Polling ist daher wieder entfernt --
      # jede zusaetzliche periodische Aktualisierung war ein moeglicher Beitrag zum
      # beobachteten Zucken. Live-Aktualisierung laeuft jetzt ausschliesslich
      # ereignisgesteuert (siehe switch:/datetime:-Sektion und Kommentar am Dateianfang).

time:
  # Primaer: Zeit von Home Assistant ueber die bereits bestehende native API-Verbindung
  # -- normalerweise sehr schnell nach dem Verbindungsaufbau verfuegbar, kein Umweg
  # ueber externe NTP-Server noetig.
  - platform: homeassistant
    id: current_time
    timezone: Europe/Berlin
    # update_interval: 1h -- Zeit-Resync reicht stuendlich, nicht haeufiger (Wunsch des
    # Nutzers). Die interne Systemuhr laeuft dazwischen ganz normal per Software weiter
    # (on_time seconds:0 aktualisiert die Anzeige weiterhin jede Minute) -- nur der
    # tatsaechliche Re-Sync mit Home Assistant/NTP passiert seltener.
    update_interval: 1h
    on_time_sync:
      then:
        - lambda: "id(time_synced) = true;"
        - lvgl.widget.hide: sync_status_label
        - lvgl.widget.update:
            id: ntp_status_dot
            bg_color: 0x4CAF50
        - script.execute: clock_update_script
    on_time:
      - seconds: 0
        then:
          - script.execute: clock_update_script
          - script.execute: alarm_check_script

  # Fallback: klassisches NTP, falls Home Assistant/die API-Verbindung mal nicht
  # erreichbar ist (z.B. HA startet gerade neu). Unabhaengige zweite Zeitquelle --
  # beide aktualisieren dieselbe Systemuhr, welche zuerst synchronisiert "gewinnt".
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    update_interval: 1h
    on_time_sync:
      then:
        - lambda: "id(time_synced) = true;"
        - lvgl.widget.hide: sync_status_label
        - lvgl.widget.update:
            id: ntp_status_dot
            bg_color: 0x4CAF50
        - script.execute: clock_update_script

script:
  - id: clock_update_script
    then:
      - lvgl.label.update:
          id: clock_time_label
          text: !lambda |-
            auto now = id(current_time).now();
            static char buf[6];
            snprintf(buf, sizeof(buf), "%02d:%02d", now.hour, now.minute);
            return buf;
      - lvgl.label.update:
          id: clock_date_label
          text: !lambda |-
            auto now = id(current_time).now();
            if (!now.is_valid()) return "";
            static const char * const day_names[] = {"Sonntag", "Montag", "Dienstag",
                "Mittwoch", "Donnerstag", "Freitag", "Samstag"};
            static const char * const month_names[] = {"Januar", "Februar", "März", "April",
                "Mai", "Juni", "Juli", "August", "September", "Oktober", "November", "Dezember"};
            static char buf[40];
            snprintf(buf, sizeof(buf), "%s, %d. %s", day_names[now.day_of_week - 1],
                now.day_of_month, month_names[now.month - 1]);
            return buf;
      - lvgl.label.update:
          id: alarm_summary_label
          text: !lambda |-
            static char buf[64];
            if (!id(alarm_master_switch).state) {
              snprintf(buf, sizeof(buf), "Wecker: aus");
              return buf;
            }
            char days[32] = "";
            if (id(alarm_mon).state) strcat(days, "Mo ");
            if (id(alarm_tue).state) strcat(days, "Di ");
            if (id(alarm_wed).state) strcat(days, "Mi ");
            if (id(alarm_thu).state) strcat(days, "Do ");
            if (id(alarm_fri).state) strcat(days, "Fr ");
            if (id(alarm_sat).state) strcat(days, "Sa ");
            if (id(alarm_sun).state) strcat(days, "So ");
            if (strlen(days) == 0) {
              snprintf(buf, sizeof(buf), "Wecker: %02d:%02d (kein Tag aktiv)",
                  (int) id(alarm_hour).state, (int) id(alarm_minute).state);
            } else {
              snprintf(buf, sizeof(buf), "Wecker: %02d:%02d - %s",
                  (int) id(alarm_hour).state, (int) id(alarm_minute).state, days);
            }
            return buf;

  # Berechnet den Text der obersten Zeile ("Außen: X°C   Zimmer: Y°C") aus den beiden
  # MQTT-Sensoren. Fehlt ein Wert: je nach temp_hide_switch entweder "n/v" oder die
  # jeweilige Haelfte komplett weglassen. Fehlen BEIDE und ist der Schalter an: Zeile
  # komplett ausblenden (lvgl.widget.hide) statt nur leeren Text zu zeigen.
  - id: update_temp_label_script
    then:
      - lvgl.label.update:
          id: outside_room_temp_label
          text: !lambda |-
            bool have_outside = id(outside_temp_mqtt).has_state();
            bool have_room = id(room_temp_mqtt).has_state();
            bool hide_missing = id(temp_hide_switch).state;
            char outside_part[24] = "";
            char room_part[24] = "";
            if (have_outside) {
              snprintf(outside_part, sizeof(outside_part), "Außen: %.1f°C", id(outside_temp_mqtt).state);
            } else if (!hide_missing) {
              snprintf(outside_part, sizeof(outside_part), "Außen: n/v");
            }
            if (have_room) {
              snprintf(room_part, sizeof(room_part), "Zimmer: %.1f°C", id(room_temp_mqtt).state);
            } else if (!hide_missing) {
              snprintf(room_part, sizeof(room_part), "Zimmer: n/v");
            }
            static char buf[64];
            if (strlen(outside_part) == 0 && strlen(room_part) == 0) {
              buf[0] = '\0';
            } else if (strlen(outside_part) == 0) {
              snprintf(buf, sizeof(buf), "%s", room_part);
            } else if (strlen(room_part) == 0) {
              snprintf(buf, sizeof(buf), "%s", outside_part);
            } else {
              snprintf(buf, sizeof(buf), "%s     %s", outside_part, room_part);
            }
            return buf;
      - if:
          condition:
            lambda: |-
              bool have_outside = id(outside_temp_mqtt).has_state();
              bool have_room = id(room_temp_mqtt).has_state();
              return (!have_outside && !have_room && id(temp_hide_switch).state);
          then:
            - lvgl.widget.hide: outside_room_temp_label
          else:
            - lvgl.widget.show: outside_room_temp_label

  - id: update_master_switch_label_script
    then:
      - if:
          condition:
            lambda: "return id(alarm_master_switch).state;"
          then:
            - lvgl.label.update:
                id: master_switch_label
                text: "Wecker aktiv"
                text_color: 0x4CAF50
          else:
            - lvgl.label.update:
                id: master_switch_label
                text: "Wecker inaktiv"
                text_color: 0x888888

  # Wird jetzt NUR NOCH beim Oeffnen der Einstellungsseite ("Einst."-Button) aufgerufen
  # (einmaliger "Pull"), NICHT MEHR periodisch vom 500ms-Interval (siehe Stufe-29-
  # Hinweis am Dateianfang -- das war die Ursache des Zuckens/Blitzens). Zieht
  # Hauptschalter-Widget+Label und alle 7 Wochentag-Checkboxen aus dem aktuellen
  # Entity-Zustand nach.
  - id: live_sync_switches_script
    then:
      - lvgl.widget.update:
          id: master_switch_widget
          state:
            checked: !lambda "return id(alarm_master_switch).state;"
      - script.execute: update_master_switch_label_script
      - lvgl.widget.update:
          id: checkbox_mon
          state:
            checked: !lambda "return id(alarm_mon).state;"
      - lvgl.widget.update:
          id: checkbox_tue
          state:
            checked: !lambda "return id(alarm_tue).state;"
      - lvgl.widget.update:
          id: checkbox_wed
          state:
            checked: !lambda "return id(alarm_wed).state;"
      - lvgl.widget.update:
          id: checkbox_thu
          state:
            checked: !lambda "return id(alarm_thu).state;"
      - lvgl.widget.update:
          id: checkbox_fri
          state:
            checked: !lambda "return id(alarm_fri).state;"
      - lvgl.widget.update:
          id: checkbox_sat
          state:
            checked: !lambda "return id(alarm_sat).state;"
      - lvgl.widget.update:
          id: checkbox_sun
          state:
            checked: !lambda "return id(alarm_sun).state;"

  - id: alarm_check_script
    then:
      - lambda: |-
          if (!id(alarm_master_switch).state) return;
          auto t = id(current_time).now();
          if (!t.is_valid()) return;

          bool tag_aktiv = false;
          switch (t.day_of_week) {
            case 1: tag_aktiv = id(alarm_sun).state; break;
            case 2: tag_aktiv = id(alarm_mon).state; break;
            case 3: tag_aktiv = id(alarm_tue).state; break;
            case 4: tag_aktiv = id(alarm_wed).state; break;
            case 5: tag_aktiv = id(alarm_thu).state; break;
            case 6: tag_aktiv = id(alarm_fri).state; break;
            case 7: tag_aktiv = id(alarm_sat).state; break;
          }

          if (tag_aktiv && t.hour == (int) id(alarm_hour).state && t.minute == (int) id(alarm_minute).state) {
            id(alarm_ring_script).execute();
          }

  - id: alarm_ring_script
    mode: restart
    then:
      - lvgl.page.show: alarm_page
      # Kein Ton auf diesem Board -- Weckung erfolgt rein visuell: Hintergrund UND das
      # grosse "ALARM"-Label blinken abwechselnd, bis eine der beiden Touchflaechen
      # angetippt wird.
      - while:
          condition:
            script.is_running: alarm_ring_script
          then:
            - lvgl.widget.update:
                id: alarm_bg
                bg_color: 0xD32F2F
            - lvgl.widget.update:
                id: alarm_text_label
                text_color: 0xFFFFFF
            - delay: 500ms
            - lvgl.widget.update:
                id: alarm_bg
                bg_color: 0x330000
            - lvgl.widget.update:
                id: alarm_text_label
                text_color: 0x330000
            - delay: 500ms

  - id: alarm_stop_script
    then:
      - script.stop: alarm_ring_script
      - script.stop: alarm_snooze_script
      - lvgl.page.show: clock_page

  - id: alarm_snooze_script
    then:
      - script.stop: alarm_ring_script
      - lvgl.page.show: clock_page
      - delay: 9min
      - script.execute: alarm_ring_script

# ---------------------------------------------------------------------------
# WECK-LOGIK: Weckzeit, Wochentage, Hauptschalter (persistent ueber Neustarts)
#
# Alles hier ist bewusst ein REINER Wertespeicher (restore_value/restore_mode fuer die
# Persistenz). Die on_turn_on/on_turn_off-Handler weiter unten duerfen seit Stufe 29
# zwar ein LVGL-Widget aktualisieren, aber NUR gated durch `ui_ready` (siehe Kommentar
# am Dateianfang) -- damit bleibt das urspruengliche, bestaetigte Absturzmuster
# (Widget-Update waehrend des Boot-Restores, bevor LVGL existiert) ausgeschlossen.
# ---------------------------------------------------------------------------

globals:
  # Zwischenspeicher fuer die beiden Minuten-Ziffern-Roller (Zehner/Einer). Nur zum
  # Zusammenrechnen der per Roller gewaehlten Ziffern zu einem Minutenwert -- reine
  # Widget->Entity-Richtung, kein Bezug zum bekannten Absturzmuster.
  - id: minute_tens
    type: int
    restore_value: false
    initial_value: "3"
  - id: minute_ones
    type: int
    restore_value: false
    initial_value: "0"
  - id: time_synced
    type: bool
    restore_value: false
    initial_value: "false"
  - id: sync_blink_state
    type: bool
    restore_value: false
    initial_value: "false"
  # STUFE 29: wird 2s nach on_boot auf true gesetzt (siehe esphome.on_boot oben). Gated
  # die neuen on_turn_on/on_turn_off-Widget-Updates der Schalter weiter unten, damit sie
  # nicht schon waehrend des Boot-Restores (LVGL existiert da noch nicht) feuern koennen.
  - id: ui_ready
    type: bool
    restore_value: false
    initial_value: "false"
  # STUFE 32: waehrend ein Roller SELBST gerade eine Aenderung nach aussen meldet
  # (on_value -> datetime.time.set: alarm_time_ha), wird dieses Flag kurzzeitig auf
  # true gesetzt. Verhindert, dass der neue, ereignisgesteuerte Roller-Live-Sync
  # (siehe datetime:-Sektion) in genau diesem Moment denselben Roller (oder die
  # anderen beiden) ueberschreibt und so ein aktives Scrollen/Ziehen stoert -- exakt
  # das Risiko, das in Stufe 27 dazu gefuehrt hat, Roller bewusst von der Live-Sync
  # auszunehmen. Aenderungen von AUSSEN (z.B. Home Assistant) setzen dieses Flag
  # nicht, duerfen die Roller also weiterhin live aktualisieren.
  - id: roller_driven_update
    type: bool
    restore_value: false
    initial_value: "false"

number:
  # internal: true -- nur noch intern genutzt (Roller-Synchronisation, Alarm-Check).
  # Die eigentliche HA-seitige Weckzeit-Eingabe ist die "Weckzeit"-Uhrzeit-Entitaet
  # weiter unten (datetime:).
  - platform: template
    name: "Wecker Stunde"
    id: alarm_hour
    internal: true
    unit_of_measurement: "h"
    min_value: 0
    max_value: 23
    step: 1
    initial_value: 7
    optimistic: true
    restore_value: true

  - platform: template
    name: "Wecker Minute"
    id: alarm_minute
    internal: true
    unit_of_measurement: "min"
    min_value: 0
    max_value: 59
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true

# Native HA-"Uhrzeit"-Entitaet als komfortable Alternative zu den beiden (in HA
# verborgenen) Number-Entities oben. Bidirektional synchron gehalten: Aenderung ueber
# HA -> on_value -> number.set (reine Entity->Entity-Aktion, kein LVGL-Zugriff);
# Aenderung ueber die Roller -> zusaetzlich zum number.set auch datetime.time.set hier.
datetime:
  - platform: template
    type: time
    id: alarm_time_ha
    name: "Weckzeit"
    optimistic: true
    restore_value: true
    on_value:
      then:
        - number.set:
            id: alarm_hour
            value: !lambda "return x.hour;"
        - number.set:
            id: alarm_minute
            value: !lambda "return x.minute;"
        # STUFE 32: zieht die Roller live nach, wenn die Weckzeit von AUSSEN (z.B. Home
        # Assistant) geaendert wurde -- vorher passierte das nur beim erneuten Oeffnen
        # der Einstellungsseite. `ui_ready` verhindert das bekannte Boot-Absturzmuster,
        # `roller_driven_update` verhindert, dass ein Roller sich waehrend des eigenen
        # Scrollens selbst ueberschreibt (siehe globals:-Kommentar).
        - if:
            condition:
              lambda: "return id(ui_ready) && !id(roller_driven_update);"
            then:
              - lvgl.roller.update:
                  id: roller_hour
                  selected_index: !lambda "return x.hour;"
              - globals.set:
                  id: minute_tens
                  value: !lambda "return x.minute / 10;"
              - globals.set:
                  id: minute_ones
                  value: !lambda "return x.minute % 10;"
              - lvgl.roller.update:
                  id: roller_minute_tens
                  selected_index: !lambda "return id(minute_tens);"
              - lvgl.roller.update:
                  id: roller_minute_ones
                  selected_index: !lambda "return id(minute_ones);"

switch:
  # Steuert, ob die Temperaturzeile bei fehlendem Wert "n/v" anzeigt (aus, Standard)
  # oder komplett ausgeblendet wird (an). Rein HA-seitig, kein Widget auf dem Display.
  - platform: template
    name: "Wecker Temperaturzeile ausblenden falls leer"
    id: temp_hide_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      then:
        - script.execute: update_temp_label_script
    on_turn_off:
      then:
        - script.execute: update_temp_label_script

  - platform: template
    name: "Wecker aktiv"
    id: alarm_master_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    # STUFE 29: ereignisgesteuertes Nachziehen des Widgets statt 500ms-Polling (siehe
    # Kommentar am Dateianfang). `ui_ready`-Gate verhindert das urspruengliche
    # Absturzmuster waehrend des Boot-Restores.
    on_turn_on:
      then:
        - logger.log:
            format: "[wecker] alarm_master_switch on_turn_on gefeuert, ui_ready=%d"
            args: ["(int) id(ui_ready)"]
        - if:
            condition:
              lambda: "return id(ui_ready);"
            then:
              - lvgl.widget.update:
                  id: master_switch_widget
                  state:
                    checked: true
              - script.execute: update_master_switch_label_script
    on_turn_off:
      then:
        - logger.log:
            format: "[wecker] alarm_master_switch on_turn_off gefeuert, ui_ready=%d"
            args: ["(int) id(ui_ready)"]
        - if:
            condition:
              lambda: "return id(ui_ready);"
            then:
              - lvgl.widget.update:
                  id: master_switch_widget
                  state:
                    checked: false
              - script.execute: update_master_switch_label_script

  - platform: template
    name: "Wecker Montag"
    id: alarm_mon
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    on_turn_on:
      then:
        - logger.log:
            format: "[wecker] alarm_mon on_turn_on gefeuert, ui_ready=%d"
            args: ["(int) id(ui_ready)"]
        - if:
            condition:
              lambda: "return id(ui_ready);"
            then:
              - lvgl.widget.update:
                  id: checkbox_mon
                  state:
                    checked: true
    on_turn_off:
      then:
        - logger.log:
            format: "[wecker] alarm_mon on_turn_off gefeuert, ui_ready=%d"
            args: ["(int) id(ui_ready)"]
        - if:
            condition:
              lambda: "return id(ui_ready);"
            then:
              - lvgl.widget.update:
                  id: checkbox_mon
                  state:
                    checked: false
  - platform: template
    name: "Wecker Dienstag"
